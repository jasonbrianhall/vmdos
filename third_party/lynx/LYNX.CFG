# LYNX.CFG: Lynx's settings for vmdos (C:\VMDOS\NET\LYNX.CFG; LYNX_CFG=file
# or LYNX -cfg=file for another). Everything not here is Lynx's default:
# the full list, with what each does, is Lynx's own lynx.cfg
# (https://lynx.invisible-island.net/lynx_help/body.html).

# The first page (LYNX with no URL; WWW_HOME=url overrides it), and the
# help page ('h' or ?)
STARTFILE:https://lynx.invisible-island.net/
HELPFILE:https://lynx.invisible-island.net/lynx_help/lynx_help_main.html

# The PC's text screen is code page 437: accented letters, box lines and
# so on from any page's character set are shown with it
CHARACTER_SET:cp437

# HTTPS (OpenSSL): certificates are checked against %SSL_CERT_FILE%,
# C:\VMDOS\NET\CACERT.PEM unless set (the CAs WGET uses). One that doesn't
# check out is asked about (PROMPT), or always accepted (YES) or refused (NO).
FORCE_SSL_PROMPT:PROMPT

# Cookies: accepted (asked about otherwise), and kept between runs in
# %HOME%\.lynx_cookies (HOME is C:\HOME unless set)
ACCEPT_ALL_COOKIES:TRUE
PERSISTENT_COOKIES:TRUE

# Ctrl-E in a form's text field, and 'e' on a local file: FreeDOS's EDIT
DEFAULT_EDITOR:EDIT

# Seconds to wait for a connection and for data
CONNECT_TIMEOUT:60
READ_TIMEOUT:120

# The mouse (vmdos's own, or CTMOUSE): click a link to follow it; on the
# bottom line, the left end goes back, the right end cancels, the middle
# pages down; on the top line, the middle pages up (FALSE: keys only)
USE_MOUSE:TRUE

# Colors: COLOR:n:foreground:background (Lynx's lynx.cfg lists them), e.g.
# light gray on black instead of black on light gray:
#COLOR:0:lightgray:black
