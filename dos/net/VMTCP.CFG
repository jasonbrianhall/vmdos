# vmdos TCP/IP settings (mTCP format). DHCP fills in the addresses;
# VMTCP shows them, VMTCP KEY value sets one by hand.
PACKETINT 0x60
HOSTNAME VMDOS
# Static IPv4 instead of DHCP, for example:
#   IPADDR 192.168.1.50
#   NETMASK 255.255.255.0
#   GATEWAY 192.168.1.1
#   NAMESERVER 192.168.1.1
# IPv6 is on unless IPV6 OFF; static, for example:
#   IPV6ADDR 2001:db8::50/64
#   IPV6GATEWAY fe80::1
#   IPV6NAMESERVER 2001:db8::1
