set timeout=5
insmod all_video

menuentry "FreeDOS (vmdos)" {
    multiboot /boot/vmdos.elf
    module /boot/dos.img.gz dos.img
}

menuentry "FreeDOS (vmdos) noxms" {
    multiboot /boot/vmdos.elf noxms
    module /boot/dos.img.gz dos.img
}

menuentry "FreeDOS (vmdos) RAM Disk" {
    multiboot /boot/vmdos.elf c=ram
    module /boot/dos.img.gz dos.img
}

menuentry "FreeDOS (vmdos) DEBUG" {
    multiboot /boot/vmdos.elf debug=2
    module /boot/dos.img.gz dos.img
}

menuentry "FreeDOS (vmdos) with Voodoo 3" {
    multiboot /boot/vmdos.elf voodoo3
    module /boot/dos.img.gz dos.img
}

if [ "$grub_platform" = "pc" ]; then
menuentry "FreeDOS (vmdos), video card's own BIOS (VBE, no scaling)" {
    multiboot /boot/vmdos.elf video=vbe
    set gfxpayload=text
    module /boot/dos.img.gz dos.img
}
fi
